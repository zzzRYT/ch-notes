<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>RichTextEditor</title>
    <!-- DIAGNOSTIC: forward any web-editor error to the RN side so it surfaces
         in Metro logs (the WebView console is otherwise invisible on-device).
         Runs as a classic script before the deferred module bundle. -->
    <script>
      (function () {
        function send(kind, detail) {
          try {
            window.ReactNativeWebView &&
              window.ReactNativeWebView.postMessage(
                JSON.stringify({ type: "web-error", payload: { kind: kind, detail: detail } }),
              );
          } catch (_) {}
        }
        function describe(err, fallbackMsg) {
          if (err && typeof err === "object") {
            var name = err.name || "Error";
            var msg = err.message || "";
            var stack = err.stack || "";
            return name + ": " + msg + (stack ? " | " + stack : "");
          }
          return String(fallbackMsg != null ? fallbackMsg : err);
        }
        window.addEventListener("error", function (e) {
          send(
            "error",
            describe(e.error, e.message) +
              " @ " + (e.filename || "") + ":" + e.lineno + ":" + e.colno,
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          send("unhandledrejection", describe(e.reason, e.reason));
        });
        var origError = console.error;
        console.error = function () {
          send("console.error", Array.prototype.map.call(arguments, String).join(" "));
          origError.apply(console, arguments);
        };
      })();
    </script>
    <style>
      /* Theme tokens — overridden at runtime from the RN palette via injectCSS. */
      :root {
        --rt-ink: #1a1a1a;
        --rt-ink2: #555;
        --rt-ink3: #999;
        --rt-bg: #ffffff;
        --rt-accent: #257ab4;
        --rt-accent-soft: rgba(37, 122, 180, 0.08);
        --rt-rule: #e6e6e6;
        --rt-font: -apple-system, system-ui, "Pretendard", sans-serif;
        --rt-font-size: 17px;
        --rt-line: 1.6;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--rt-bg);
      }

      #root > div:nth-of-type(1) {
        position: absolute;
        height: 100%;
        overflow: auto;
        width: 100%;
        top: 0;
        bottom: 0;
      }
      #root > div.dynamic-height {
        height: unset;
      }
      #root div .ProseMirror {
        min-height: 100%;
        overflow: visible;
        padding: 12px 20px 80px;
        box-sizing: border-box;
        color: var(--rt-ink);
        font-family: var(--rt-font);
        font-size: var(--rt-font-size);
        line-height: var(--rt-line);
        -webkit-text-size-adjust: 100%;
      }
      #root div.dynamic-height .ProseMirror {
        height: unset;
      }
      .ProseMirror:focus {
        outline: none;
      }

      .ProseMirror h1 {
        font-size: 1.7em;
        font-weight: 700;
        margin: 0.6em 0 0.3em;
      }
      .ProseMirror h2 {
        font-size: 1.4em;
        font-weight: 700;
        margin: 0.6em 0 0.3em;
      }
      .ProseMirror h3 {
        font-size: 1.18em;
        font-weight: 600;
        margin: 0.5em 0 0.25em;
      }
      .ProseMirror p {
        margin: 0.35em 0;
      }
      .ProseMirror ul,
      .ProseMirror ol {
        padding-left: 1.3em;
        margin: 0.35em 0;
      }
      .ProseMirror blockquote {
        border-left: 3px solid var(--rt-rule);
        margin: 0.5em 0;
        padding: 0.1em 0 0.1em 0.9em;
        color: var(--rt-ink2);
      }
      .ProseMirror u {
        text-decoration: underline;
      }

      /* Task list (checkbox) */
      .ProseMirror ul[data-type="taskList"] {
        list-style: none;
        padding-left: 0.2em;
      }
      .ProseMirror ul[data-type="taskList"] li {
        display: flex;
        align-items: flex-start;
        gap: 0.5em;
      }
      .ProseMirror ul[data-type="taskList"] li > label {
        margin-top: 0.25em;
        user-select: none;
      }
      .ProseMirror ul[data-type="taskList"] li > div {
        flex: 1;
      }
      .ProseMirror ul[data-type="taskList"] input[type="checkbox"] {
        width: 1.1em;
        height: 1.1em;
        accent-color: var(--rt-accent);
      }

      /* Scripture quote node (read-only) */
      .verse-quote {
        margin: 0.7em 0;
        padding: 0.7em 0.9em;
        border-radius: 10px;
        background: var(--rt-accent-soft);
        border-left: 3px solid var(--rt-accent);
      }
      .verse-quote__ref {
        font-size: 0.78em;
        font-weight: 700;
        color: var(--rt-accent);
        margin-bottom: 0.35em;
      }
      .verse-quote__row {
        display: flex;
        gap: 0.5em;
        margin-top: 0.15em;
      }
      .verse-quote__num {
        min-width: 1.1em;
        font-size: 0.72em;
        font-weight: 700;
        color: var(--rt-ink3);
        padding-top: 0.25em;
      }
      .verse-quote__text {
        flex: 1;
      }
      .verse-quote__hint {
        color: var(--rt-ink3);
      }
      .verse-quote__error {
        color: #c0392b;
      }

      .ProseMirror .is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        float: left;
        color: var(--rt-ink3);
        pointer-events: none;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
