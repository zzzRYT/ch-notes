<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>RichTextEditor</title>
    <!-- DIAGNOSTIC: forward any web-editor error to the RN side so it surfaces
         in Metro logs (the WebView console is otherwise invisible on-device).
         Runs as a classic script before the deferred module bundle. -->
    <script>
      (function () {
        function send(kind, detail) {
          try {
            window.ReactNativeWebView &&
              window.ReactNativeWebView.postMessage(
                JSON.stringify({ type: "web-error", payload: { kind: kind, detail: detail } }),
              );
          } catch (_) {}
        }
        function describe(err, fallbackMsg) {
          if (err && typeof err === "object") {
            var name = err.name || "Error";
            var msg = err.message || "";
            var stack = err.stack || "";
            return name + ": " + msg + (stack ? " | " + stack : "");
          }
          return String(fallbackMsg != null ? fallbackMsg : err);
        }
        window.addEventListener("error", function (e) {
          send(
            "error",
            describe(e.error, e.message) +
              " @ " + (e.filename || "") + ":" + e.lineno + ":" + e.colno,
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          send("unhandledrejection", describe(e.reason, e.reason));
        });
        var origError = console.error;
        console.error = function () {
          send("console.error", Array.prototype.map.call(arguments, String).join(" "));
          origError.apply(console, arguments);
        };
      })();
    </script>
    <style>
      /* Theme tokens — overridden at runtime from the RN palette via injectCSS. */
      :root {
        --rt-ink: #1a1a1a;
        --rt-ink2: #555;
        --rt-ink3: #999;
        --rt-bg: #ffffff;
        --rt-accent: #257ab4;
        --rt-accent-soft: rgba(37, 122, 180, 0.08);
        --rt-rule: #e6e6e6;
        --rt-font: -apple-system, system-ui, "Pretendard", sans-serif;
        --rt-font-size: 17px;
        --rt-line: 1.6;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--rt-bg);
      }

      #root > div:nth-of-type(1) {
        position: absolute;
        height: 100%;
        overflow: auto;
        width: 100%;
        top: 0;
        bottom: 0;
      }
      /* 문서 높이만큼 늘어나는 모드(RichNoteEditor) — 스크롤은 바깥 RN ScrollView가 한다.
         absolute·min-height:100%를 두면 웹뷰 높이가 문서 높이를 다시 끌어올려 줄지 않는다. */
      #root > div.dynamic-height:nth-of-type(1) {
        position: static;
        height: auto;
        overflow: visible;
      }
      #root div.dynamic-height .ProseMirror {
        min-height: 0;
      }
      #root div .ProseMirror {
        min-height: 100%;
        overflow: visible;
        padding: 12px 20px 80px;
        box-sizing: border-box;
        color: var(--rt-ink);
        font-family: var(--rt-font);
        font-size: var(--rt-font-size);
        line-height: var(--rt-line);
        -webkit-text-size-adjust: 100%;
      }
      #root div.dynamic-height .ProseMirror {
        height: unset;
      }
      .ProseMirror:focus {
        outline: none;
      }

      .ProseMirror h1 {
        font-size: 1.7em;
        font-weight: 700;
        margin: 0.6em 0 0.3em;
      }
      .ProseMirror h2 {
        font-size: 1.4em;
        font-weight: 700;
        margin: 0.6em 0 0.3em;
      }
      .ProseMirror h3 {
        font-size: 1.18em;
        font-weight: 600;
        margin: 0.5em 0 0.25em;
      }
      .ProseMirror p {
        margin: 0.35em 0;
      }
      .ProseMirror ul,
      .ProseMirror ol {
        padding-left: 1.3em;
        margin: 0.35em 0;
      }
      .ProseMirror blockquote {
        border-left: 3px solid var(--rt-rule);
        margin: 0.5em 0;
        padding: 0.1em 0 0.1em 0.9em;
        color: var(--rt-ink2);
      }
      .ProseMirror u {
        text-decoration: underline;
      }

      /* Task list (checkbox) */
      .ProseMirror ul[data-type="taskList"] {
        list-style: none;
        padding-left: 0.2em;
      }
      .ProseMirror ul[data-type="taskList"] li {
        display: flex;
        align-items: flex-start;
        gap: 0.5em;
      }
      /* 체크박스를 첫 줄의 세로 가운데에 둔다 — label을 한 줄 높이(글자 크기 × 줄 간격)의
         flex 상자로 만들어 그 안에서 가운데 정렬한다. margin 어림값으로 맞추면 input이
         글자 기준선에 앉아 글자보다 아래로 처졌다. 여러 줄이어도 첫 줄에 맞는다. */
      .ProseMirror ul[data-type="taskList"] li > label {
        display: flex;
        align-items: center;
        height: calc(1em * var(--rt-line));
        margin: 0;
        user-select: none;
      }
      .ProseMirror ul[data-type="taskList"] li > div {
        flex: 1;
      }
      .ProseMirror ul[data-type="taskList"] li > label > input[type="checkbox"] {
        width: 1.1em;
        height: 1.1em;
        margin: 0;
        accent-color: var(--rt-accent);
      }

      /* Scripture quote node (read-only) */
      .verse-quote {
        margin: 0.7em 0;
        padding: 0.7em 0.9em;
        border-radius: 10px;
        background: var(--rt-accent-soft);
        border-left: 3px solid var(--rt-accent);
      }
      .verse-quote__ref {
        font-size: 0.78em;
        font-weight: 700;
        color: var(--rt-accent);
        margin-bottom: 0.35em;
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
      .verse-quote__toggle {
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .verse-quote__row {
        display: flex;
        gap: 0.5em;
        margin-top: 0.15em;
      }
      .verse-quote__num {
        min-width: 1.6em;
        font-size: 0.72em;
        font-weight: 700;
        color: var(--rt-ink3);
        padding-top: 0.25em;
      }
      .verse-quote__text {
        flex: 1;
      }
      .verse-quote__hint {
        color: var(--rt-ink3);
      }
      .verse-quote__error {
        color: #c0392b;
      }

      /* "/" 메뉴 */
      .slash-menu {
        display: none;
        position: absolute;
        z-index: 10;
        min-width: 200px;
        padding: 4px;
        border-radius: 10px;
        background: var(--rt-bg);
        border: 1px solid var(--rt-rule);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        font-family: var(--rt-font);
        font-size: 16px;
        color: var(--rt-ink);
      }
      .slash-menu__item {
        display: flex;
        justify-content: space-between;
        padding: 8px 10px;
        border-radius: 6px;
      }
      .slash-menu__item.is-active {
        background: var(--rt-accent-soft);
      }
      .slash-menu__hint {
        color: var(--rt-ink3);
        font-size: 13px;
      }

      .ProseMirror .is-editor-empty:first-child::before {
        /* 빈 노트의 안내. data-placeholder(tentap 설정)는 쓰지 않는다 — RichNoteEditor 주석 참고. */
        content: "창 1:2 처럼 쓰고 띄어 쓰면 본문이 들어갑니다\A“/”를 누르면 제목·목록·할 일을 넣을 수 있습니다";
        white-space: pre-line;
        float: left;
        color: var(--rt-ink3);
        pointer-events: none;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
