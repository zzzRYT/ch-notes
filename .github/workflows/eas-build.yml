name: EAS Build

# Manual native builds on EAS servers. Kept manual (workflow_dispatch) so build
# credits are only consumed on demand. Uses --no-wait: the job queues the build
# and returns a build URL instead of blocking a runner for the full build.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        default: preview
        options: [preview, production, development]
      platform:
        description: "Target platform"
        type: choice
        default: all
        options: [all, ios, android]

defaults:
  run:
    working-directory: apps/ch-life

jobs:
  build:
    name: EAS build (${{ github.event.inputs.profile }} / ${{ github.event.inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ch-life/pnpm-lock.yaml

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        # --ignore-workspace: 루트 pnpm-workspace.yaml(packages/*)은 이 앱을 멤버로
        # 포함하지 않는데도 pnpm v10이 상위로 올라가 워크스페이스를 대신 설치한다.
        # Phase 4에서 앱이 정식 멤버가 될 때까지 독립 프로젝트로 설치한다.
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build
        env:
          EAS_PROFILE: ${{ github.event.inputs.profile }}
          EAS_PLATFORM: ${{ github.event.inputs.platform }}
          HOT_UPDATER_BASE_URL: ${{ vars.HOT_UPDATER_BASE_URL }}
          HOT_UPDATER_PRIVATE_KEY: ${{ secrets.HOT_UPDATER_PRIVATE_KEY }}
        run: eas build --profile "$EAS_PROFILE" --platform "$EAS_PLATFORM" --non-interactive --no-wait
