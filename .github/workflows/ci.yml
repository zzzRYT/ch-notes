name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ch-life

jobs:
  quality:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm via corepack (bundled with Node) instead of
      # pnpm/action-setup, whose action archive intermittently 404s from
      # codeload on the runners and blocks every job at "Set up job". corepack
      # downloads no external action. --activate sets the global default so
      # `pnpm` resolves from the repo root too, where setup-node's cache step
      # runs `pnpm store path` (there is no root package.json to read).
      - name: Install pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ch-life/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:ci

      # Advisory only: surfaces Expo SDK / dependency drift but does not block
      # merges. The Metro-config check is a known false positive under pnpm dlx
      # (this project has no metro.config.js), so the job is non-blocking.
      - name: Expo doctor
        run: pnpm dlx expo-doctor@latest
        continue-on-error: true
