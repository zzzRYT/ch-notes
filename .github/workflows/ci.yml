name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ch-life

jobs:
  quality:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ch-life/pnpm-lock.yaml

      - name: Install dependencies
        # --ignore-workspace: 루트 pnpm-workspace.yaml(packages/*)은 이 앱을 멤버로
        # 포함하지 않는데도 pnpm v10이 상위로 올라가 워크스페이스를 대신 설치한다.
        # Phase 4에서 앱이 정식 멤버가 될 때까지 독립 프로젝트로 설치한다.
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:ci

      # Advisory only: surfaces Expo SDK / dependency drift but does not block
      # merges. The Metro-config check is a known false positive under pnpm dlx
      # (this project has no metro.config.js), so the job is non-blocking.
      - name: Expo doctor
        run: pnpm dlx expo-doctor@latest
        continue-on-error: true
