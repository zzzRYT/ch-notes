name: Hot Updater (OTA)

# Publishes a signed Hot Updater bundle after CI succeeds. Manual production
# deploys use the same checked-in workflow and explicit channel choice.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Hot Updater channel to publish to"
        type: choice
        default: preview
        options: [preview, production]

concurrency:
  group: hot-updater-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ch-life

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    # On workflow_run, only proceed when CI passed. Manual runs always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish the exact commit that passed CI (workflow_run), else current ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ch-life/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard production channel
        # production 은 사용자에게 닿는다. 그 발행은 릴리스 가지에서만 낸다
        # (wiki/decisions/ADR-0020-branch-strategy.md). main 에서 production 을 쏘면 스토어에 올린
        # 것과 다른 코드가 기존 설치본으로 나간다.
        env:
          HOT_UPDATER_CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
        run: |
          if [ "$HOT_UPDATER_CHANNEL" = "production" ]; then
            case "${{ github.ref }}" in
              refs/heads/release/*) ;;
              *) echo "::error::production 채널은 release/** 가지에서만 발행한다 (현재 ${{ github.ref }})"; exit 1 ;;
            esac
          fi

      - name: Restore bundle signing key
        env:
          HOT_UPDATER_PRIVATE_KEY: ${{ secrets.HOT_UPDATER_PRIVATE_KEY }}
        run: |
          mkdir -p keys
          printf '%s' "$HOT_UPDATER_PRIVATE_KEY" > keys/private-key.pem
          chmod 600 keys/private-key.pem

      - name: Publish signed update
        env:
          HOT_UPDATER_CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
          HOT_UPDATER_BASE_URL: ${{ vars.HOT_UPDATER_BASE_URL }}
          HOT_UPDATER_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HOT_UPDATER_CLOUDFLARE_ACCOUNT_ID }}
          HOT_UPDATER_CLOUDFLARE_API_TOKEN: ${{ secrets.HOT_UPDATER_CLOUDFLARE_API_TOKEN }}
          HOT_UPDATER_CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.HOT_UPDATER_CLOUDFLARE_D1_DATABASE_ID }}
          HOT_UPDATER_CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.HOT_UPDATER_CLOUDFLARE_R2_BUCKET_NAME }}
          HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          UPDATE_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.sha }}
        run: |
          # 값이 "있는지"가 아니라 "모양이 맞는지" 본다. 존재 검사만 했을 때
          # 잘못된 R2 키(53자)가 통과해 번들링·서명을 다 마친 뒤 업로드에서
          # 죽는 일이 반복됐다. 틀렸으면 여기서, 크레딧을 쓰기 전에 멈춘다.
          fail() { echo "::error::$1"; exit 1; }
          match() { printf '%s' "$2" | grep -Eq "$3" || fail "$1 형식이 맞지 않는다 ($4)"; }

          match HOT_UPDATER_BASE_URL "$HOT_UPDATER_BASE_URL" \
            '^https://[A-Za-z0-9.-]+' "https:// 로 시작하는 URL"
          match HOT_UPDATER_CLOUDFLARE_ACCOUNT_ID "$HOT_UPDATER_CLOUDFLARE_ACCOUNT_ID" \
            '^[0-9a-f]{32}$' "32자리 hex"
          match HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID "$HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID" \
            '^[0-9a-f]{32}$' "32자리 hex — R2 API 토큰의 Access Key ID"
          match HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY "$HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY" \
            '^[0-9a-f]{64}$' "64자리 hex — R2 API 토큰의 Secret Access Key"
          match HOT_UPDATER_CLOUDFLARE_D1_DATABASE_ID "$HOT_UPDATER_CLOUDFLARE_D1_DATABASE_ID" \
            '^[0-9a-f-]{36}$' "UUID"
          test -n "$HOT_UPDATER_CLOUDFLARE_API_TOKEN" || fail "HOT_UPDATER_CLOUDFLARE_API_TOKEN 이 비어 있다"
          test -n "$HOT_UPDATER_CLOUDFLARE_R2_BUCKET_NAME" || fail "HOT_UPDATER_CLOUDFLARE_R2_BUCKET_NAME 이 비어 있다"
          test -s keys/private-key.pem || fail "HOT_UPDATER_PRIVATE_KEY 가 비어 있다"
          TARGET_APP_VERSION="$(pnpm exec expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          pnpm exec hot-updater deploy \
            --channel "$HOT_UPDATER_CHANNEL" \
            --target-app-version "$TARGET_APP_VERSION" \
            --message "$UPDATE_MESSAGE"
