name: Deploy website (GitHub Pages)

# Publishes only the website/ folder (privacy policy + landing).
# Internal docs/ (plans) are intentionally NOT published.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync live store versions
        id: store_versions
        continue-on-error: true
        run: node apps/ch-life/scripts/sync-store-versions.mjs

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail the run when a store lookup used its fallback
        if: always() && steps.store_versions.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deployed, but at least one store version lookup failed; see the sync step for the retained platform value."
          exit 1
