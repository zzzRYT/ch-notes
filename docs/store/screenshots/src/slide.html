<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--navy:#122649;--navy2:#0b1932;--sky:#95c9fc;--mint:#8dd3bc;--cream:#fbf7f1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:"Pretendard","Pretendard Variable",sans-serif;-webkit-font-smoothing:antialiased}
.slide{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg)}
.deco{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
.copy{position:absolute;left:0;right:0;top:8.4vw;text-align:center;z-index:2;padding:0 6vw}
.eyebrow{display:inline-block;font-weight:700;font-size:3.5vw;letter-spacing:.02em;padding:1.3vw 3.4vw;border-radius:99px;background:var(--chip);color:var(--chipfg);margin-bottom:4.2vw}
h1{font-weight:800;font-size:8.6vw;line-height:1.24;letter-spacing:-.035em;word-break:keep-all}
h1 em{font-style:normal;color:var(--em)}
p{margin-top:3.4vw;font-weight:500;font-size:3.9vw;line-height:1.45;opacity:.78;letter-spacing:-.01em;word-break:keep-all}
.phone{position:absolute;left:50%;transform:translateX(-50%);top:var(--ptop);width:var(--pw);border-radius:11vw;background:#0d0f14;padding:2.1vw;
  box-shadow:0 5vw 10vw rgba(8,18,40,.35),0 0 0 .5vw rgba(255,255,255,.08) inset;z-index:1}
.screen{border-radius:9vw;overflow:hidden;background:var(--sb)}
.sbar{height:9.6vw;display:flex;align-items:center;justify-content:space-between;padding:0 7.4vw;font-weight:700;font-size:3.5vw;color:var(--sbfg);position:relative}
.island{position:absolute;left:50%;top:2.4vw;transform:translateX(-50%);width:20vw;height:5.8vw;border-radius:99px;background:#000}
.hole{position:absolute;left:50%;top:3vw;transform:translateX(-50%);width:3.6vw;height:3.6vw;border-radius:50%;background:#000}
.bat{width:6.4vw;height:3vw;border:.45vw solid currentColor;border-radius:.9vw;position:relative;opacity:.9}
.bat:after{content:"";position:absolute;inset:.4vw;background:currentColor;border-radius:.3vw}
.screen img{display:block;width:100%}
.ipad .copy{top:7vw}.ipad .eyebrow{font-size:2.4vw;padding:1vw 2.6vw;margin-bottom:3vw}.ipad h1{font-size:6.4vw}.ipad p{font-size:2.7vw;margin-top:2.4vw}
.ipad .phone{border-radius:5vw;padding:1.6vw}.ipad .screen{border-radius:3.6vw}.ipad .sbar{height:4.6vw;font-size:1.9vw;padding:0 4vw}.ipad .bat{width:3.6vw;height:1.7vw;border-width:.3vw;border-radius:.5vw}.ipad .bat:after{inset:.25vw}
</style></head>
